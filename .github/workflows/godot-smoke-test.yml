name: Godot project smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project resources
        run: godot --headless --path . --editor --quit
      - name: Run main scene for 360 frames and assert no GDScript errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 360 2>&1 | tee /tmp/wow-main.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid access to property|Invalid call\.' /tmp/wow-main.log; then
            echo "Godot runtime errors detected in main scene."
            exit 1
          fi
      - name: Validate assets showroom and assert no GDScript errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 30 res://scenes/asset_showroom.tscn 2>&1 | tee /tmp/wow-showroom.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid access to property|Invalid call\.' /tmp/wow-showroom.log; then
            echo "Godot runtime errors detected in asset showroom."
            exit 1
          fi
      - name: Test mine smelter transport and power accounting
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/factory_smoke.gd 2>&1 | tee /tmp/wow-factory.log
          grep -F 'FACTORY SMOKE OK' /tmp/wow-factory.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|FACTORY TEST:' /tmp/wow-factory.log; then
            echo "Factory integration test failed."
            exit 1
          fi
      - name: Test conveyor belts routing and material balance
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/conveyor_smoke.gd 2>&1 | tee /tmp/wow-conveyor.log
          grep -F 'CONVEYOR SMOKE OK' /tmp/wow-conveyor.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|CONVEYOR TEST:' /tmp/wow-conveyor.log; then
            echo "Conveyor integration test failed."
            exit 1
          fi
      - name: Test manual conveyor waypoints, ports and zero-cost preview
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/conveyor_manual_smoke.gd 2>&1 | tee /tmp/wow-manual-belts.log
          grep -F 'MANUAL BELT SMOKE OK' /tmp/wow-manual-belts.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|MANUAL BELT TEST:' /tmp/wow-manual-belts.log; then
            echo "Manual conveyor geometry / route test failed."
            exit 1
          fi
      - name: Test solar plant, battery storage, spark visuals and cables
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/power_grid_smoke.gd 2>&1 | tee /tmp/wow-grid.log
          grep -F 'POWER GRID SMOKE OK' /tmp/wow-grid.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|POWER TEST:' /tmp/wow-grid.log; then
            echo "Grid integration test failed."
            exit 1
          fi
      - name: Verify building zones and no overlapping structures
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/build_placement_smoke.gd 2>&1 | tee /tmp/wow-building.log
          grep -F 'PLACEMENT SMOKE OK' /tmp/wow-building.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PLACEMENT TEST:' /tmp/wow-building.log; then
            echo "Building occupancy and build preview integration test failed."
            exit 1
          fi
      - name: Verify 3D construction ghosts, orientation and grid snapping
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/building_ghost_smoke.gd 2>&1 | tee /tmp/wow-build-ghost.log
          grep -F 'GHOST SMOKE OK' /tmp/wow-build-ghost.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|GHOST TEST:' /tmp/wow-build-ghost.log; then
            echo "Build hologram rotation or snapping test failed."
            exit 1
          fi
      - name: Test build blueprints, technical roads and exact group costs
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/infrastructure_planning_smoke.gd 2>&1 | tee /tmp/wow-infra.log
          grep -F 'INFRA SMOKE OK' /tmp/wow-infra.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|INFRA TEST:' /tmp/wow-infra.log; then
            echo "Infrastructure planning or road integration test failed."
            exit 1
          fi
      - name: Test versioned save load and in-flight cargo conservation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/save_load_smoke.gd 2>&1 | tee /tmp/wow-save-load.log
          grep -F 'SAVE LOAD SMOKE OK' /tmp/wow-save-load.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SAVE TEST:' /tmp/wow-save-load.log; then
            echo "Save/load integration test failed."
            exit 1
          fi
      - name: Test shared inventory reservations and logistic cargo ownership
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/inventory_smoke.gd 2>&1 | tee /tmp/wow-inventory.log
          grep -F 'INVENTORY SMOKE OK' /tmp/wow-inventory.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|INVENTORY TEST:' /tmp/wow-inventory.log; then
            echo "Inventory test failed"
            exit 1
          fi
      - name: Test intermediate depots, shared ports and persistent reservations
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/logistics_depot_smoke.gd 2>&1 | tee /tmp/wow-depot.log
          grep -F 'DEPOT SMOKE OK' /tmp/wow-depot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|DEPOT TEST:' /tmp/wow-depot.log; then
            exit 1
          fi
      - name: Test priority logistics jobs and resumed reserved deliveries
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/logistics_jobs_smoke.gd 2>&1 | tee /tmp/wow-jobs.log
          grep -F 'LOGISTICS JOB SMOKE OK' /tmp/wow-jobs.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|JOB TEST:' /tmp/wow-jobs.log; then
            exit 1
          fi
      - name: Test multiple depots sharing one reserved mine output
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/logistics_multidepot_smoke.gd 2>&1 | tee /tmp/wow-multi-depot.log
          grep -F 'MULTIDEPOT SMOKE OK' /tmp/wow-multi-depot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|MULTIDEPOT TEST:' /tmp/wow-multi-depot.log; then
            exit 1
          fi
      - name: Test logistics panel commands and persisted stock limits
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/logistics_panel_smoke.gd 2>&1 | tee /tmp/wow-logistics-ui.log
          grep -F 'LOGISTICS PANEL SMOKE OK' /tmp/wow-logistics-ui.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|LOGISTICS UI TEST:' /tmp/wow-logistics-ui.log; then
            exit 1
          fi
      - name: Test unreachable logistics route retries and rollbacks
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/logistics_recovery_smoke.gd 2>&1 | tee /tmp/wow-logistics-recovery.log
          grep -F 'LOGISTICS RECOVERY SMOKE OK' /tmp/wow-logistics-recovery.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|RECOVERY TEST:' /tmp/wow-logistics-recovery.log; then
            exit 1
          fi
      - name: Test atomic rerouting of loaded hauler cargo
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/logistics_redirect_smoke.gd 2>&1 | tee /tmp/wow-redirect.log
          grep -F 'LOGISTICS REDIRECT SMOKE OK' /tmp/wow-redirect.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|REDIRECT TEST:' /tmp/wow-redirect.log; then
            exit 1
          fi
      - name: Test twenty robots and multi-depot resource conservation
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/logistics_fleet_smoke.gd 2>&1 | tee /tmp/wow-fleet.log
          grep -F 'LOGISTICS FLEET SMOKE OK' /tmp/wow-fleet.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|FLEET TEST:' /tmp/wow-fleet.log; then
            exit 1
          fi
      - name: Test factory production telemetry and stall reasons
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/production_monitor_smoke.gd 2>&1 | tee /tmp/wow-production-monitor.log
          grep -F 'PRODUCTION MONITOR SMOKE OK' /tmp/wow-production-monitor.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PRODUCTION TEST:' /tmp/wow-production-monitor.log; then
            exit 1
          fi
      - name: Test production console, finite queues, pause and alarms
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/production_console_smoke.gd 2>&1 | tee /tmp/wow-production-console.log
          grep -F 'PRODUCTION CONSOLE SMOKE OK' /tmp/wow-production-console.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PRODUCTION CONSOLE TEST:' /tmp/wow-production-console.log; then
            exit 1
          fi
      - name: Test responsive production console at multiple resolutions
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/production_layout_smoke.gd 2>&1 | tee /tmp/wow-production-layout.log
          grep -F 'PRODUCTION LAYOUT SMOKE OK' /tmp/wow-production-layout.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PRODUCTION LAYOUT TEST:' /tmp/wow-production-layout.log; then
            exit 1
          fi
      - name: Test prioritized multi-batch factory production queues
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/production_queue_smoke.gd 2>&1 | tee /tmp/wow-production-queue.log
          grep -F 'PRODUCTION QUEUE SMOKE OK' /tmp/wow-production-queue.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PRODUCTION QUEUE TEST:' /tmp/wow-production-queue.log; then
            exit 1
          fi
      - name: Test planet cycling preserves gameplay state
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/planet_smoke.gd 2>&1 | tee /tmp/wow-planets.log
          grep -F 'PLANET SMOKE OK' /tmp/wow-planets.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/wow-planets.log; then
            echo "GDScript errors detected in planet smoke test."
            exit 1
          fi

  windows-save-load:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4 on Windows
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project on Windows
        shell: pwsh
        run: godot --headless --path . --editor --quit
      - name: Save/load filesystem and cargo roundtrip on Windows
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/save_load_smoke.gd > wow-windows-save.log 2>&1
          code=$?
          cat wow-windows-save.log
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          grep -F 'SAVE LOAD SMOKE OK' wow-windows-save.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SAVE TEST:' wow-windows-save.log; then
            exit 1
          fi
