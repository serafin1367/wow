name: Godot project smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project resources
        run: godot --headless --path . --editor --quit
      - name: Run main scene for 360 frames and assert no GDScript errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 360 2>&1 | tee /tmp/wow-main.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid access to property|Invalid call\.' /tmp/wow-main.log; then
            echo "Godot runtime errors detected in main scene."
            exit 1
          fi
      - name: Validate assets showroom and assert no GDScript errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 30 res://scenes/asset_showroom.tscn 2>&1 | tee /tmp/wow-showroom.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid access to property|Invalid call\.' /tmp/wow-showroom.log; then
            echo "Godot runtime errors detected in asset showroom."
            exit 1
          fi
      - name: Test mine smelter transport and power accounting
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/factory_smoke.gd 2>&1 | tee /tmp/wow-factory.log
          grep -F 'FACTORY SMOKE OK' /tmp/wow-factory.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|FACTORY TEST:' /tmp/wow-factory.log; then
            echo "Factory integration test failed."
            exit 1
          fi
      - name: Test conveyor belts routing and material balance
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/conveyor_smoke.gd 2>&1 | tee /tmp/wow-conveyor.log
          grep -F 'CONVEYOR SMOKE OK' /tmp/wow-conveyor.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|CONVEYOR TEST:' /tmp/wow-conveyor.log; then
            echo "Conveyor integration test failed."
            exit 1
          fi
      - name: Test manual conveyor waypoints, ports and zero-cost preview
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/conveyor_manual_smoke.gd 2>&1 | tee /tmp/wow-manual-belts.log
          grep -F 'MANUAL BELT SMOKE OK' /tmp/wow-manual-belts.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|MANUAL BELT TEST:' /tmp/wow-manual-belts.log; then
            echo "Manual conveyor geometry / route test failed."
            exit 1
          fi
      - name: Test solar plant, battery storage, spark visuals and cables
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/power_grid_smoke.gd 2>&1 | tee /tmp/wow-grid.log
          grep -F 'POWER GRID SMOKE OK' /tmp/wow-grid.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|POWER TEST:' /tmp/wow-grid.log; then
            echo "Grid integration test failed."
            exit 1
          fi
      - name: Verify building zones and no overlapping structures
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/build_placement_smoke.gd 2>&1 | tee /tmp/wow-building.log
          grep -F 'PLACEMENT SMOKE OK' /tmp/wow-building.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|PLACEMENT TEST:' /tmp/wow-building.log; then
            echo "Building occupancy and build preview integration test failed."
            exit 1
          fi
      - name: Verify 3D construction ghosts, orientation and grid snapping
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/building_ghost_smoke.gd 2>&1 | tee /tmp/wow-build-ghost.log
          grep -F 'GHOST SMOKE OK' /tmp/wow-build-ghost.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|GHOST TEST:' /tmp/wow-build-ghost.log; then
            echo "Build hologram rotation or snapping test failed."
            exit 1
          fi
      - name: Test build blueprints, technical roads and exact group costs
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/infrastructure_planning_smoke.gd 2>&1 | tee /tmp/wow-infra.log
          grep -F 'INFRA SMOKE OK' /tmp/wow-infra.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|INFRA TEST:' /tmp/wow-infra.log; then
            echo "Infrastructure planning or road integration test failed."
            exit 1
          fi
      - name: Test versioned save load and in-flight cargo conservation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/save_load_smoke.gd 2>&1 | tee /tmp/wow-save-load.log
          grep -F 'SAVE LOAD SMOKE OK' /tmp/wow-save-load.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SAVE TEST:' /tmp/wow-save-load.log; then
            echo "Save/load integration test failed."
            exit 1
          fi
      - name: Test planet cycling preserves gameplay state
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/planet_smoke.gd 2>&1 | tee /tmp/wow-planets.log
          grep -F 'PLANET SMOKE OK' /tmp/wow-planets.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/wow-planets.log; then
            echo "GDScript errors detected in planet smoke test."
            exit 1
          fi

  windows-save-load:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4 on Windows
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project on Windows
        shell: pwsh
        run: godot --headless --path . --editor --quit
      - name: Save/load filesystem and cargo roundtrip on Windows
        shell: pwsh
        run: |
          $log = & godot --headless --path . --script res://tests/save_load_smoke.gd 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0 -or $log -notmatch 'SAVE LOAD SMOKE OK' -or $log -match 'SCRIPT ERROR:|Parse Error:|SAVE TEST:') {
            throw "Windows save/load regression failed"
          }
